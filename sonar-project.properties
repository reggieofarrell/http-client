# =============================================================================
# SonarQube Scanner Configuration — @reggieofarrell/http-client
# =============================================================================
# Identity must stay in lockstep with .sonarlint/connectedMode.json and the
# VS Code sonarlint.connectedMode.project binding. CI and local precheck both
# read these keys; renaming the project means updating all three before the
# next analysis. If the project is created via GitHub import, paste the
# generated key here instead of this stable manual key.
sonar.projectKey=reggieofarrell_http-client_fa00cd5b-d27d-4e01-ad36-07bef0a90815
sonar.projectName=http-client

# Pin the server so local tooling and SonarQube for IDE agree with CI. GitHub
# Actions separately receives SONAR_HOST_URL from a repository variable because
# the scanner action and quality-gate action need it in the runner environment.
sonar.host.url=https://sonar.casadega.dev

# Scan authored library source and repository tooling. Generated output and
# dependencies never enter the scanner.
sonar.sources=src,scripts
sonar.tests=tests,scripts
sonar.sourceEncoding=UTF-8

sonar.exclusions=dist/**,coverage/**,node_modules/**

# Tests remain analyzable as tests without inflating production duplication,
# complexity, or coverage.
sonar.test.inclusions=\
  tests/**,\
  scripts/**/*.test.mjs

# Jest writes one LCOV report. That combined figure in Sonar is informational;
# jest.config.js coverageThreshold remains the coverage authority.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Tests, tooling, and declaration files should not dilute the coverage signal
# Sonar displays.
sonar.coverage.exclusions=\
  **/*.d.ts,\
  tests/**,\
  scripts/**,\
  src/index.ts

# Local scanner runs wait for the server-side quality gate. CI overrides this
# during upload, polls Compute Engine itself via the official quality-gate
# action, and enforces the project's new-code conditions.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Give the JavaScript analyzer the production TypeScript program.
sonar.typescript.tsconfigPaths=tsconfig.json

# Generated or minified assets should never contribute duplication findings.
sonar.cpd.exclusions=**/*.min.js
