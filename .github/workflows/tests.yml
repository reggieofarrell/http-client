name: Tests

# Jest coverageThreshold in jest.config.js is the coverage authority. SonarQube
# consumes LCOV for display only. See docs/development/sonarqube.md.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  # Superseded pull-request feedback may be cancelled. Main runs are serialized
  # so cancelling one cannot interrupt an in-flight Sonar baseline upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Root dependency installation reads Casadega's private development tooling.
# This personal repository therefore supplies a read-only package token in
# addition to the ordinary source-code permission.
permissions:
  contents: read
  packages: read

# Keep the CI-only GitHub Packages auth placeholder separate from developers'
# user-level npm credentials.
env:
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.github/npmrc

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm ci
      - name: Format check
        # eslint extends eslint-config-prettier (formatting rules disabled), so `npm run lint`
        # does not catch Prettier drift on its own.
        run: npm run check:format
      - name: Lint
        run: npm run lint
      - name: Restore locked shared RuleSync policy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm run rules:install
      - name: Validate Sonar baseline
        # Shared tooling validates the committed server identity and generated
        # local profile without contacting SonarQube.
        run: npm run sonar:check
      - name: Validate package baseline
        run: npm run packages:check
      - name: Rules in sync (rulesync)
        # Fails if the generated agent-instruction files drift from the .rulesync/ source.
        run: npm run rules:check
      - name: Agent configuration portability
        run: npm run agent-config:check
      - name: Agent hook adapter contract
        run: npm run test:agent-hook
      - name: Hook script permissions
        # Catches a script losing its executable bit before a bare-path agent hook depending on
        # it silently stops running - see scripts/check-hook-permissions.mjs.
        run: npm run check:hooks
      - name: Hook permission check unit tests
        run: npm run test:hook-permissions

  types:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm ci
      - name: Type-check
        run: npm run test:types

  test:
    name: Tests (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm ci
      - name: Run tests with coverage
        # jest.config.js coverageThreshold enforces the gate; a coverage regression fails this step.
        run: npm test -- --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install root dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm ci
      - name: Install docs site dependencies
        run: npm --prefix website ci
      - name: Build docs site
        run: npm run docs:build

  sonarqube:
    name: SonarQube
    needs: test
    # Always surface failed prerequisites as a failed scanner context. Fork PRs
    # retain the existing secret policy and do not run credential-bearing analysis.
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      actions: read
      contents: read
      # The reusable workflow restores locked Node dependencies before analysis and therefore
      # requires package-registry read access even when this repository only uses public packages.
      packages: read
    # Reviewed shared release isolates repository preparation from the Sonar credential.
    # Adopt future releases through a reviewed immutable SHA update.
    uses: Casadega-Development/action-workflows/.github/workflows/sonar-scan.yml@4779d64bef299ba4bee7b6dc4b829cf05d617d37 # v1.0.1
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      prerequisite-result: ${{ needs.test.result }}
      coverage-artifacts-json: '[{"name":"coverage","path":"coverage"}]'
      issue-gate-scope: new-code
      enforce-quality-gate: true
      use-pull-request-scan: ${{ github.event_name == 'pull_request' }}
      pull-request-key: ${{ github.event.pull_request.number || '' }}
      pull-request-branch: ${{ github.head_ref || '' }}
      pull-request-base: ${{ github.base_ref || '' }}
      scm-revision: ${{ github.event.pull_request.head.sha || '' }}
      checkout-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      branch-name: ${{ github.ref_name }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify build output
        run: npm run check:build

  audit:
    name: Audit (runtime deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm ci
      # --omit=dev keeps this meaningful: http-client ships exactly one runtime dependency
      # (xior), so this stays a real signal instead of devDependency noise.
      - name: Runtime dependency audit
        run: npm run check:audit

  quality:
    name: Quality gate
    # Inspect every result even when an earlier job failed or was skipped, so
    # branch protection has one explicit overall result instead of a false skip.
    if: always()
    needs: [lint, types, test, docs, sonarqube, build, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful prerequisites
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPES_RESULT: ${{ needs.types.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          SONAR_RESULT: ${{ needs.sonarqube.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          for result in "$LINT_RESULT" "$TYPES_RESULT" "$TEST_RESULT" "$DOCS_RESULT" "$BUILD_RESULT" "$AUDIT_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::A required quality job did not succeed ($result)."
              exit 1
            fi
          done
          # Only the existing untrusted-fork policy permits a skipped scan.
          if [ "$SONAR_RESULT" != success ] && ! { [ "$IS_FORK_PR" = true ] && [ "$SONAR_RESULT" = skipped ]; }; then
            echo "::error::SonarQube did not succeed ($SONAR_RESULT)."
            exit 1
          fi
