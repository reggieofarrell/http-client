name: Publish Package to NPM

# Publishes @reggieofarrell/http-client to npm when a GitHub Release is published.
# Auth uses npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN secret.
# See: https://docs.npmjs.com/trusted-publishers/
#
# One-time setup required before this can succeed (see README "Releasing"):
#   1. Create a GitHub Environment named `npm` in repo settings (Settings > Environments).
#   2. From an authenticated npm CLI session:
#        npm trust github --repository reggieofarrell/http-client --file release.yml \
#          --environment npm --allow-publish
#   Trusted Publishing requires npm >= 11.16, which is why this pins .nvmrc (Node 24).

on:
  release:
    types: [published]

permissions:
  # Required so the npm CLI can exchange a short-lived GitHub OIDC token
  # for publish rights. Without this, Trusted Publishing cannot authenticate.
  id-token: write
  contents: read
  packages: read

# Dependency restoration requires the private Casadega package. The publish
# step remains tokenless so npm Trusted Publishing can use OIDC.
env:
  NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.github/npmrc

jobs:
  publish:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fail-closed: this Environment must exist (with `npm trust github` registered against it)
    # before a release event, or the publish step below has no way to authenticate.
    environment: npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin via .nvmrc so publish matches local/dev and CI. Trusted Publishing (OIDC)
          # requires npm >= 11.16, which .nvmrc's Node version ships.
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm ci

      - name: Restore locked shared RuleSync policy
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CASADEGA_PACKAGES_TOKEN }}
        run: npm run rules:install

      - name: Run release verification
        # The same complete command is used before the release PR and again against the immutable
        # release tag. It includes the dual-README tarball canary before publication.
        run: npm run release:verify

      # No NODE_AUTH_TOKEN — the npm CLI detects the OIDC environment and
      # authenticates via Trusted Publishing. Provenance is attached automatically
      # for public packages from public repos.
      - name: Publish to npm
        run: npm publish --provenance --access public
